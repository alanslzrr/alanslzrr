name: Generate README Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate stats graphics
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const blue = "#00A3FF";
            const colors = {
              text: "#F0F6FC",
              muted: "#8B949E",
              subtle: "#6E7681",
              border: "#30363D",
              grid: "#21262D",
              blue,
              blueSoft: "#7DD3FC",
              blueDim: "#0A84FF"
            };
            const languageColors = {
              TypeScript: "#00A3FF",
              JavaScript: "#93C5FD",
              Python: "#38BDF8",
              HTML: "#60A5FA",
              CSS: "#2563EB",
              "C++": "#CBD5E1",
              C: "#94A3B8",
              "C#": "#7DD3FC",
              JupyterNotebook: "#7DD3FC",
              "Jupyter Notebook": "#7DD3FC",
              MDX: "#BAE6FD",
              Shell: "#64748B",
              Dockerfile: "#475569",
              Astro: "#0EA5E9",
              Vue: "#67E8F9",
              Go: "#22D3EE",
              Rust: "#94A3B8"
            };
            const escape = (value) =>
              String(value).replace(/[&<>"']/g, (char) => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
              }[char]));
            const format = (value) => Number(value || 0).toLocaleString("en-US");
            const pct = (value, total) => `${((value / Math.max(total, 1)) * 100).toFixed(1)}%`;
            const dateLabel = (date) =>
              new Intl.DateTimeFormat("en", { month: "short", day: "2-digit", timeZone: "UTC" })
                .format(new Date(`${date}T00:00:00Z`));
            const compactLanguageName = (language) => {
              const aliases = {
                "Jupyter Notebook": "Jupyter NB"
              };
              const normalized = aliases[language] || language;
              return normalized.length > 12 ? `${normalized.slice(0, 10)}...` : normalized;
            };

            const userQuery = `
              query($login: String!) {
                user(login: $login) {
                  name
                  repositories(first: 1, ownerAffiliations: OWNER, privacy: PUBLIC) {
                    totalCount
                  }
                  contributionsCollection {
                    totalCommitContributions
                    totalPullRequestContributions
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          date
                          contributionCount
                        }
                      }
                    }
                  }
                }
              }
            `;

            const data = await github.graphql(userQuery, { login: owner });
            const user = data.user;
            const repos = await github.paginate(github.rest.repos.listForUser, {
              username: owner,
              type: "owner",
              sort: "updated",
              per_page: 100
            });
            const sourceRepos = repos.filter((repo) => !repo.fork);
            const stars = sourceRepos.reduce((total, repo) => total + repo.stargazers_count, 0);
            const forks = sourceRepos.reduce((total, repo) => total + repo.forks_count, 0);
            const languageTotals = new Map();

            for (const repo of sourceRepos) {
              const languages = await github.request("GET /repos/{owner}/{repo}/languages", {
                owner,
                repo: repo.name
              });
              for (const [language, bytes] of Object.entries(languages.data)) {
                languageTotals.set(language, (languageTotals.get(language) || 0) + bytes);
              }
            }

            const topLanguages = [...languageTotals.entries()]
              .sort((a, b) => b[1] - a[1])
              .slice(0, 8);
            const languageBytes = topLanguages.reduce((total, [, bytes]) => total + bytes, 0) || 1;
            const allDays = user.contributionsCollection.contributionCalendar.weeks
              .flatMap((week) => week.contributionDays);
            const days = allDays.slice(-112);
            const maxDay = Math.max(...days.map((day) => day.contributionCount), 1);
            const yMax = Math.max(4, Math.ceil(maxDay / 5) * 5);

            const stats = [
              ["Stars", stars],
              ["Forks", forks],
              ["Year contributions", user.contributionsCollection.contributionCalendar.totalContributions],
              ["Year commits", user.contributionsCollection.totalCommitContributions],
              ["Pull requests", user.contributionsCollection.totalPullRequestContributions],
              ["Public repositories", user.repositories.totalCount]
            ];
            const statRows = stats.map(([label, value], index) => {
              const x = 42 + (index % 3) * 220;
              const y = 122 + Math.floor(index / 3) * 82;
              return `
                <g class="reveal" style="animation-delay:${120 + index * 60}ms">
                  <text x="${x}" y="${y}" fill="${colors.muted}" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1.7">${escape(label.toUpperCase())}</text>
                  <text x="${x}" y="${y + 36}" fill="${colors.text}" font-family="Georgia, 'Times New Roman', serif" font-size="31">${escape(format(value))}</text>
                  <line x1="${x}" y1="${y + 52}" x2="${x + 158}" y2="${y + 52}" stroke="${colors.border}" stroke-opacity="0.72"/>
                </g>
              `;
            }).join("");

            let barOffset = 0;
            const languageBar = topLanguages.map(([language, bytes]) => {
              const width = Math.max(8, (bytes / languageBytes) * 500);
              const color = languageColors[language] || colors.blueSoft;
              const rect = `<rect x="${768 + barOffset}" y="106" width="${width}" height="8" rx="4" fill="${color}"/>`;
              barOffset += width;
              return rect;
            }).join("");
            const languageRows = topLanguages.map(([language, bytes], index) => {
              const x = 768 + (index % 2) * 252;
              const y = 158 + Math.floor(index / 2) * 37;
              const color = languageColors[language] || colors.blueSoft;
              const label = compactLanguageName(language);
              return `
                <g class="reveal" style="animation-delay:${260 + index * 45}ms">
                  <circle cx="${x}" cy="${y - 5}" r="5.5" fill="${color}"/>
                  <text x="${x + 18}" y="${y}" fill="${colors.text}" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14.5" font-weight="650">${escape(label)}</text>
                  <text x="${x + 186}" y="${y}" fill="${colors.muted}" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" text-anchor="end">${pct(bytes, languageBytes)}</text>
                </g>
              `;
            }).join("");

            const statsSvg = `
              <svg width="1320" height="310" viewBox="0 0 1320 310" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
                <title id="title">GitHub stats overview</title>
                <desc id="desc">GitHub statistics and most used languages for ${escape(owner)}</desc>
                <style>
                  @keyframes fadeDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
                  .reveal { opacity: 0; animation: fadeDown 720ms cubic-bezier(.2,.8,.2,1) forwards; }
                </style>
                <line x1="42" y1="28" x2="584" y2="28" stroke="${colors.border}" stroke-opacity="0.7"/>
                <text x="612" y="34" fill="${colors.subtle}" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="5">GITHUB STATS</text>
                <line x1="736" y1="28" x2="1280" y2="28" stroke="${colors.border}" stroke-opacity="0.7"/>
                <g class="reveal">
                  <text x="42" y="72" fill="${colors.text}" font-family="Georgia, 'Times New Roman', serif" font-size="38">GitHub</text>
                  <text x="182" y="72" fill="${colors.blue}" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-style="italic">signal.</text>
                  <text x="768" y="72" fill="${colors.text}" font-family="Georgia, 'Times New Roman', serif" font-size="32">Most used languages</text>
                </g>
                <g class="reveal" style="animation-delay:180ms">
                  <rect x="768" y="106" width="500" height="8" rx="4" fill="${colors.border}" fill-opacity="0.5"/>
                  ${languageBar}
                </g>
                ${statRows}
                ${languageRows}
              </svg>
            `.trim();

            const chart = { left: 78, top: 70, width: 1110, height: 285, bottom: 355 };
            const smoothPath = (pathPoints) => {
              if (pathPoints.length < 2) return "";
              const commands = [`M ${pathPoints[0].x.toFixed(2)} ${pathPoints[0].y.toFixed(2)}`];
              for (let index = 0; index < pathPoints.length - 1; index++) {
                const current = pathPoints[index];
                const next = pathPoints[index + 1];
                const previous = pathPoints[index - 1] || current;
                const afterNext = pathPoints[index + 2] || next;
                const cp1x = current.x + (next.x - previous.x) / 6;
                const cp1y = current.y + (next.y - previous.y) / 6;
                const cp2x = next.x - (afterNext.x - current.x) / 6;
                const cp2y = next.y - (afterNext.y - current.y) / 6;
                commands.push(`C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)}, ${cp2x.toFixed(2)} ${cp2y.toFixed(2)}, ${next.x.toFixed(2)} ${next.y.toFixed(2)}`);
              }
              return commands.join(" ");
            };
            const points = days.map((day, index) => {
              const x = chart.left + index * (chart.width / Math.max(days.length - 1, 1));
              const y = chart.bottom - (day.contributionCount / yMax) * chart.height;
              return { x, y, count: day.contributionCount, date: day.date };
            });
            const linePath = smoothPath(points);
            const areaPath = `${linePath} L ${chart.left + chart.width} ${chart.bottom} L ${chart.left} ${chart.bottom} Z`;
            const xTickIndexes = [0, 14, 28, 42, 56, 70, 84, 98, 111].filter((index) => index < days.length);
            const xTicks = xTickIndexes.map((index) => {
              const point = points[index];
              return `
                <line x1="${point.x.toFixed(2)}" y1="${chart.top}" x2="${point.x.toFixed(2)}" y2="${chart.bottom}" stroke="${colors.grid}" stroke-opacity="0.35"/>
                <text x="${point.x.toFixed(2)}" y="394" fill="${colors.muted}" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">${dateLabel(point.date)}</text>
              `;
            }).join("");
            const yTicks = [0, Math.ceil(yMax * 0.25), Math.ceil(yMax * 0.5), Math.ceil(yMax * 0.75), yMax]
              .filter((value, index, values) => values.indexOf(value) === index)
              .map((value) => {
                const y = chart.bottom - (value / yMax) * chart.height;
                return `
                  <line x1="${chart.left}" y1="${y.toFixed(2)}" x2="${chart.left + chart.width}" y2="${y.toFixed(2)}" stroke="${colors.grid}" stroke-opacity="0.7"/>
                  <text x="54" y="${(y + 4).toFixed(2)}" fill="${colors.muted}" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="end">${value}</text>
                `;
              }).join("");
            const dayMarkers = points.map((point, index) => {
              if (point.count === 0 && index % 3 !== 0) return "";
              const opacity = point.count === 0 ? 0.18 : 0.25 + (point.count / yMax) * 0.55;
              return `<circle cx="${point.x.toFixed(2)}" cy="${point.y.toFixed(2)}" r="${point.count ? 2.2 : 1.4}" fill="${colors.blue}" opacity="${opacity.toFixed(2)}"/>`;
            }).join("");

            const timelineSvg = `
              <svg width="1320" height="455" viewBox="0 0 1320 455" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
                <title id="title">Contribution timeline</title>
                <desc id="desc">Daily contribution timeline for ${escape(owner)} with dates on the x-axis and contribution counts on the y-axis</desc>
                <style>
                  @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
                  @keyframes drawLine { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
                  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
                  .reveal { opacity: 0; animation: fadeDown 760ms cubic-bezier(.2,.8,.2,1) forwards; }
                  .grid { opacity: 0; animation: fadeIn 900ms ease forwards 160ms; }
                  .line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawLine 1.45s cubic-bezier(.2,.8,.2,1) forwards 260ms; }
                  .area { opacity: 0; animation: fadeIn 1.1s ease forwards 520ms; }
                </style>
                <defs>
                  <linearGradient id="area" x1="0" y1="${chart.top}" x2="0" y2="${chart.bottom}">
                    <stop offset="0" stop-color="${colors.blue}" stop-opacity="0.22"/>
                    <stop offset="1" stop-color="${colors.blue}" stop-opacity="0"/>
                  </linearGradient>
                  <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
                    <feGaussianBlur stdDeviation="3" result="blur"/>
                    <feMerge>
                      <feMergeNode in="blur"/>
                      <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                  </filter>
                </defs>
                <g class="reveal">
                  <line x1="42" y1="28" x2="498" y2="28" stroke="${colors.border}" stroke-opacity="0.7"/>
                  <text x="526" y="34" fill="${colors.subtle}" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="5">DAILY CONTRIBUTIONS</text>
                  <line x1="716" y1="28" x2="1280" y2="28" stroke="${colors.border}" stroke-opacity="0.7"/>
                  <text x="42" y="58" fill="${colors.text}" font-family="Georgia, 'Times New Roman', serif" font-size="38">Contribution</text>
                  <text x="278" y="58" fill="${colors.blue}" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-style="italic">timeline.</text>
                </g>
                <g class="grid">
                  ${yTicks}
                  ${xTicks}
                  <line x1="${chart.left}" y1="${chart.bottom}" x2="${chart.left + chart.width}" y2="${chart.bottom}" stroke="${colors.border}"/>
                  <line x1="${chart.left}" y1="${chart.top}" x2="${chart.left}" y2="${chart.bottom}" stroke="${colors.border}"/>
                  <text x="24" y="218" fill="${colors.muted}" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle" transform="rotate(-90 24 218)">contributions</text>
                </g>
                <path class="area" d="${areaPath}" fill="url(#area)"/>
                <path class="line" pathLength="1" d="${linePath}" stroke="${colors.blue}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
                <g class="area">${dayMarkers}</g>
                <g class="reveal" style="animation-delay:420ms">
                  <circle cx="${points.at(-1).x.toFixed(2)}" cy="${points.at(-1).y.toFixed(2)}" r="5" fill="${colors.blue}"/>
                  <text x="${Math.min(points.at(-1).x + 16, 1240).toFixed(2)}" y="${(points.at(-1).y - 10).toFixed(2)}" fill="${colors.text}" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">${points.at(-1).count} today</text>
                </g>
              </svg>
            `.trim();

            fs.mkdirSync("dist/generated", { recursive: true });
            fs.writeFileSync("dist/generated/stats.svg", statsSvg);
            fs.writeFileSync("dist/generated/timeline.svg", timelineSvg);

      - name: Push stats to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
