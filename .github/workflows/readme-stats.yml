name: Generate README Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate stats graphic
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const colors = {
              bg: "#0d1117",
              panel: "#10161f",
              panelSoft: "#0f1724",
              border: "#263241",
              title: "#58a6ff",
              text: "#c9d1d9",
              muted: "#8b949e",
              faint: "#6e7681",
              accent: "#2f81f7",
              green: "#3fb950",
              pink: "#f778ba"
            };
            const languageColors = {
              TypeScript: "#3178c6",
              JavaScript: "#f1e05a",
              Python: "#3572A5",
              HTML: "#e34c26",
              CSS: "#663399",
              MDX: "#fcb32c",
              Shell: "#89e051",
              Dockerfile: "#384d54",
              Astro: "#ff5a03",
              Vue: "#41b883",
              Go: "#00ADD8",
              Rust: "#dea584"
            };
            const escape = (value) =>
              String(value).replace(/[&<>"']/g, (char) => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
              }[char]));

            const userQuery = `
              query($login: String!) {
                user(login: $login) {
                  name
                  repositories(first: 1, ownerAffiliations: OWNER, privacy: PUBLIC) {
                    totalCount
                  }
                  contributionsCollection {
                    totalCommitContributions
                    totalPullRequestContributions
                    totalIssueContributions
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          contributionCount
                        }
                      }
                    }
                  }
                }
              }
            `;

            const data = await github.graphql(userQuery, { login: owner });
            const user = data.user;
            const repos = await github.paginate(github.rest.repos.listForUser, {
              username: owner,
              type: "owner",
              sort: "updated",
              per_page: 100
            });
            const sourceRepos = repos.filter((repo) => !repo.fork);
            const stars = sourceRepos.reduce((total, repo) => total + repo.stargazers_count, 0);
            const forks = sourceRepos.reduce((total, repo) => total + repo.forks_count, 0);
            const languageTotals = new Map();

            for (const repo of sourceRepos) {
              const languages = await github.request("GET /repos/{owner}/{repo}/languages", {
                owner,
                repo: repo.name
              });
              for (const [language, bytes] of Object.entries(languages.data)) {
                languageTotals.set(language, (languageTotals.get(language) || 0) + bytes);
              }
            }

            const topLanguages = [...languageTotals.entries()]
              .sort((a, b) => b[1] - a[1])
              .slice(0, 8);
            const languageBytes = topLanguages.reduce((total, [, bytes]) => total + bytes, 0) || 1;
            const days = user.contributionsCollection.contributionCalendar.weeks
              .flatMap((week) => week.contributionDays)
              .slice(-112);
            const maxDay = Math.max(...days.map((day) => day.contributionCount), 1);
            const points = days.map((day, index) => {
              const x = 40 + index * (620 / Math.max(days.length - 1, 1));
              const y = 555 - (day.contributionCount / maxDay) * 145;
              return { x, y };
            });
            const linePath = points.map((point, index) =>
              `${index === 0 ? "M" : "L"} ${point.x.toFixed(1)} ${point.y.toFixed(1)}`
            ).join(" ");
            const areaPath = `${linePath} L 660 575 L 40 575 Z`;
            const totalContributions = user.contributionsCollection.contributionCalendar.totalContributions;
            const stats = [
              ["Stars", stars],
              ["Forks", forks],
              ["Year contributions", totalContributions],
              ["Year commits", user.contributionsCollection.totalCommitContributions],
              ["Pull requests", user.contributionsCollection.totalPullRequestContributions],
              ["Public repositories", user.repositories.totalCount]
            ];
            const icons = [
              "M11 2.5l2.6 5.3 5.9.9-4.3 4.2 1 5.8L11 16l-5.2 2.7 1-5.8L2.5 8.7l5.9-.9L11 2.5z",
              "M8 3h8v4h-2v4h3v4h-4v6h-4v-6H5v-4h3V7H6V3h2z",
              "M4 4h16v12H7l-3 3V4z",
              "M6 4h12v16H6V4zm3 4h6m-6 4h6m-6 4h3",
              "M8 17l4-10 4 10M9.5 13h5",
              "M4 6h16v12H4V6zm3 3h10v6H7V9z"
            ];
            const overviewRows = stats.map(([label, value], index) => {
              const y = 218 + index * 34;
              return `
                <path d="${icons[index]}" transform="translate(54 ${y - 18}) scale(0.9)" fill="none" stroke="${colors.faint}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <text x="94" y="${y}" fill="${colors.muted}" font-family="Inter, Segoe UI, Ubuntu, sans-serif" font-size="16" font-weight="650">${escape(label)}</text>
                <text x="560" y="${y}" fill="${colors.text}" font-family="Inter, Segoe UI, Ubuntu, sans-serif" font-size="16" font-weight="750" text-anchor="end">${escape(value.toLocaleString("en-US"))}</text>
              `;
            }).join("");

            let offset = 0;
            const stackedBars = topLanguages.map(([language, bytes]) => {
              const width = Math.max(6, (bytes / languageBytes) * 470);
              const color = languageColors[language] || "#6e40c9";
              const rect = `<rect x="${730 + offset}" y="212" width="${width}" height="14" rx="7" fill="${color}"/>`;
              offset += width;
              return rect;
            }).join("");
            const languageRows = topLanguages.map(([language, bytes], index) => {
              const percent = ((bytes / languageBytes) * 100).toFixed(1);
              const column = index % 2;
              const row = Math.floor(index / 2);
              const x = 742 + column * 250;
              const y = 272 + row * 42;
              const color = languageColors[language] || "#6e40c9";
              return `
                <circle cx="${x}" cy="${y - 5}" r="6" fill="${color}"/>
                <text x="${x + 20}" y="${y}" fill="${colors.text}" font-family="Inter, Segoe UI, Ubuntu, sans-serif" font-size="16" font-weight="650">${escape(language)}</text>
                <text x="${x + 132}" y="${y}" fill="${colors.muted}" font-family="Inter, Segoe UI, Ubuntu, sans-serif" font-size="15" font-weight="650">${percent}%</text>
              `;
            }).join("");

            fs.mkdirSync("dist/generated", { recursive: true });
            fs.writeFileSync("dist/generated/stats.svg", `
              <svg width="1320" height="650" viewBox="0 0 1320 650" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
                <title id="title">My GitHub stats</title>
                <desc id="desc">GitHub statistics, languages, and contribution timeline for ${escape(owner)}</desc>
                <defs>
                  <linearGradient id="area" x1="0" x2="0" y1="400" y2="585">
                    <stop offset="0" stop-color="${colors.accent}" stop-opacity="0.45"/>
                    <stop offset="1" stop-color="${colors.accent}" stop-opacity="0.02"/>
                  </linearGradient>
                  <linearGradient id="line" x1="40" x2="660" y1="0" y2="0">
                    <stop offset="0" stop-color="${colors.green}"/>
                    <stop offset="0.5" stop-color="${colors.accent}"/>
                    <stop offset="1" stop-color="${colors.pink}"/>
                  </linearGradient>
                  <filter id="softGlow" x="-20%" y="-50%" width="140%" height="200%">
                    <feGaussianBlur stdDeviation="4" result="blur"/>
                    <feMerge>
                      <feMergeNode in="blur"/>
                      <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                  </filter>
                </defs>
                <rect width="1320" height="650" fill="${colors.bg}"/>
                <rect x="1" y="1" width="1318" height="648" rx="10" stroke="${colors.border}"/>
                <rect x="44" y="48" width="22" height="34" rx="3" fill="#f0f6fc"/>
                <rect x="51" y="61" width="5" height="21" fill="${colors.green}"/>
                <rect x="59" y="55" width="5" height="27" fill="${colors.accent}"/>
                <rect x="67" y="50" width="5" height="32" fill="${colors.pink}"/>
                <text x="88" y="78" fill="#f0f6fc" font-family="Inter, Segoe UI, Ubuntu, sans-serif" font-size="34" font-weight="800">My Stats</text>
                <line x1="44" y1="104" x2="1276" y2="104" stroke="${colors.border}"/>
                <rect x="44" y="136" width="580" height="262" rx="10" fill="${colors.panel}" stroke="${colors.border}"/>
                <text x="54" y="128" fill="${colors.faint}" font-family="Inter, Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700">OVERVIEW</text>
                <text x="54" y="178" fill="${colors.title}" font-family="Inter, Segoe UI, Ubuntu, sans-serif" font-size="22" font-weight="800">${escape(user.name || owner)}'s GitHub Statistics</text>
                ${overviewRows}
                <rect x="696" y="136" width="580" height="262" rx="10" fill="${colors.panel}" stroke="${colors.border}"/>
                <text x="706" y="128" fill="${colors.faint}" font-family="Inter, Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700">STACK SIGNAL</text>
                <text x="730" y="178" fill="${colors.title}" font-family="Inter, Segoe UI, Ubuntu, sans-serif" font-size="24" font-weight="800">Most Used Languages</text>
                <rect x="730" y="212" width="470" height="14" rx="7" fill="${colors.border}"/>
                ${stackedBars}
                ${languageRows}
                <rect x="44" y="430" width="1232" height="170" rx="10" fill="${colors.panelSoft}" stroke="${colors.border}"/>
                <text x="68" y="468" fill="${colors.title}" font-family="Inter, Segoe UI, Ubuntu, sans-serif" font-size="22" font-weight="800">Contribution Timeline</text>
                <text x="68" y="492" fill="${colors.muted}" font-family="Inter, Segoe UI, Ubuntu, sans-serif" font-size="14" font-weight="600">Last 16 weeks of commits and contribution activity</text>
                <text x="68" y="552" fill="#f0f6fc" font-family="Inter, Segoe UI, Ubuntu, sans-serif" font-size="34" font-weight="850">${escape(totalContributions.toLocaleString("en-US"))}</text>
                <text x="68" y="576" fill="${colors.muted}" font-family="Inter, Segoe UI, Ubuntu, sans-serif" font-size="15" font-weight="650">year contributions</text>
                <g transform="translate(570 0)">
                  <line x1="40" y1="575" x2="660" y2="575" stroke="${colors.border}"/>
                  <path d="${areaPath}" fill="url(#area)"/>
                  <path d="${linePath}" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
                  <circle cx="${points.at(-1).x.toFixed(1)}" cy="${points.at(-1).y.toFixed(1)}" r="5" fill="${colors.pink}"/>
                </g>
              </svg>
            `.trim());

      - name: Push stats to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
